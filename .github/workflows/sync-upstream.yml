name: Sync upstream

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write          # push the sync branch
  pull-requests: write     # open the pull request

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the exact commit of the v1.1.0 tag in basic-ops-tasks
      # (action served from the repo root since v1.1.0).
      # To bump: retag latest -> git rev-parse <tag>^{commit}, update the SHA.
      - uses: ruivieira/basic-ops-tasks@de6832b03605bc7b15c6e443b8541aae44fdce70 # v1.1.0
