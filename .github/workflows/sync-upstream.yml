name: Sync upstream

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write          # push the sync branch
  pull-requests: write     # open the pull request

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Iterating on feat/mode-input (mode input under review); re-pin to the
      # next tag once merged.
      - uses: ruivieira/basic-ops-tasks@feat/mode-input
        with:
          mode: fork
