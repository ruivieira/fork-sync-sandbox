name: Sync upstream

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write          # push the sync branch
  pull-requests: write     # open the pull request

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the exact commit of the v1 tag in basic-ops-tasks.
      # To bump: retag latest -> git rev-parse <tag>^{commit}, update the SHA.
      - uses: ruivieira/basic-ops-tasks@6defb068806dee0c1c44c6ac271cf9cf42d648be # v1
        with:
          mode: fork
