name: Sync upstream

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write          # push the sync branch
  pull-requests: write     # open the pull request

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the exact commit of the v1.3.0 tag in basic-ops-tasks.
      # To bump: retag latest -> git rev-parse <tag>^{commit}, update the SHA.
      - uses: ruivieira/basic-ops-tasks@f779af144984492b3accab63b4664a3aa42156cc # v1.3.0
        with:
          mode: fork
