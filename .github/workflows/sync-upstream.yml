name: Sync upstream

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write          # push the sync branch
  pull-requests: write     # open the pull request

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the exact commit of the v1.4.0 tag in basic-ops-tasks.
      # To bump: retag latest -> git rev-parse <tag>^{commit}, update the SHA.
      - uses: ruivieira/basic-ops-tasks@838d5b387f64078aee97f595d2d4bcb1ce6005b7 # v1.4.0
        with:
          mode: fork
