name: Sync branches

on:
  workflow_dispatch: {}

permissions:
  contents: write          # push the sync branch
  pull-requests: write     # open the pull request

concurrency:
  group: sync-branches

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Iterating on feat/mode-input (mode input under review); re-pin to the
      # next tag once merged.
      - uses: ruivieira/basic-ops-tasks@feat/mode-input
        with:
          mode: branch
          source-branch: develop
          target-branch: main
