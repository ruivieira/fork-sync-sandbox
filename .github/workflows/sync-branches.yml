name: Sync branches

# Cascade: whenever main advances (upstream-sync PR merged, direct push),
# open/update a rolling PR that carries the new main commits into develop.
on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write          # push the sync branch
  pull-requests: write     # open the pull request

concurrency:
  group: sync-branches

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Iterating on feat/mode-input (mode input under review); re-pin to the
      # next tag once merged.
      - uses: ruivieira/basic-ops-tasks@feat/mode-input
        with:
          mode: branch
          source-branch: main
          target-branch: develop
