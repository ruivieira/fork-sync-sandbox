name: Sync branches

on:
  workflow_dispatch: {}

permissions:
  contents: write          # push the sync branch
  pull-requests: write     # open the pull request

concurrency:
  group: sync-branches

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Feature-branch ref while branch-to-branch sync is under review;
      # pin to the v1.1.0 tag/SHA once merged.
      - uses: ruivieira/basic-ops-tasks/fork-sync-action@feat/branch-sync
        with:
          source-branch: develop
          target-branch: main
