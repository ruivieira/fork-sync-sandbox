name: Sync branches

# Cascade: whenever main advances (upstream-sync PR merged, direct push),
# open/update a rolling PR that carries the new main commits into develop.
on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write          # push the sync branch
  pull-requests: write     # open the pull request

concurrency:
  group: sync-branches

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the exact commit of the v1 tag in basic-ops-tasks.
      # To bump: retag latest -> git rev-parse <tag>^{commit}, update the SHA.
      - uses: ruivieira/basic-ops-tasks@9e7c6ea25e011631f82f0503a4842029f153894f # v1
        with:
          mode: branch
          source-branch: main
          target-branch: develop
